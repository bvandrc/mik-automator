name: Release

# Publishing a GitHub release publishes its version to PyPI. Its tag must be "v" + pyproject.toml's version (e.g. v1.2.0).
# PyPI's trusted publisher names this file (release.yml) and the pypi environment, so renaming either means updating it
# there too.
on:
  release:
    types: [published]

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # a tag that doesn't match pyproject.toml would publish under the wrong version
    - name: Check the tag matches the version
      id: version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "$TAG" != "v$version" ]; then
          echo "::error::The release's tag is $TAG, but pyproject.toml's version is $version. Its tag must be v$version."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # the package is pure Python, so building on Linux gives the same wheel as Windows
    - name: Build
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*

    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  # PyPI trusted publishing: PyPI trusts this workflow's OIDC token, so the repo stores no API token
  publish:
    name: "Publish"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mik-automator/
    permissions:
      contents: write # to fill in the release's notes and attach the distributions to it
      id-token: write # for PyPI's trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # only for a release published with empty notes, so notes written for it are kept
    - name: Read the version's changelog section
      id: changelog
      if: github.event.release.body == ''
      # it fails when CHANGELOG.md has no section for the version, which should leave the notes empty, not stop the release
      continue-on-error: true
      uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
      with:
        version: ${{ needs.build.outputs.version }}
        version_scheme: pep440

    - name: Fill in the release notes from the changelog
      if: steps.changelog.outcome == 'success'
      env:
        NOTES_FILE: ${{ steps.changelog.outputs.changes_file }}
      run: gh release edit "$TAG" --notes-file "$NOTES_FILE"

    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Attach the distributions to the release
      run: gh release upload "$TAG" dist/* --clobber
