[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mik-automator"
version = "1.2.0"
description = "Windows automator and database tools for Mixed In Key 11"
requires-python = ">= 3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "bvandrc", email = "bvandercar@outlook.com" },
]
keywords = ["mixed in key", "mixedinkey", "mik", "dj", "key detection", "harmonic mixing", "automation"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
# Windows only: pywinauto drives the app through UI Automation, and pywin32 sends it window messages
dependencies = ["pywinauto", "pywin32", "comtypes"]

[project.optional-dependencies]
# Ruff up to its next minor version, since a minor release can add stable rules and change its formatting
dev = ["ruff>=0.17,<0.18", "pyright"]

[project.urls]
Repository = "https://github.com/bvandrc/mik-automator"
Issues = "https://github.com/bvandrc/mik-automator/issues"
Changelog = "https://github.com/bvandrc/mik-automator/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mik_automator*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Every stable rule, less those below. A Ruff minor release can add stable rules, which only reach CI through a PR
# that bumps the pinned Ruff, so each one gets a decision there.
select = ["ALL"]
ignore = [
    # whole families that don't fit this codebase
    "ANN",  # type annotations everywhere: pyright checks the types
    "D",  # docstring style: the docstrings follow conventions/all.md
    "PTH",  # pathlib: the code works on paths with os.path and glob, which take str and Path alike
    "EM",  # exception messages assigned to a variable before raising
    "CPY",  # copyright notices
    "COM",  # trailing commas: the formatter adds them, and COM812 conflicts with it
    "ISC001",  # implicitly concatenated strings on one line: conflicts with the formatter
    "A",  # names that shadow builtins: `dir` is a parameter of the public run(dir), so renaming it would break callers
    # single rules, in families that are otherwise on
    "S101",  # assert: the code asserts its own assumptions, like that %LOCALAPPDATA% is set
    "TRY003",  # long exception messages: the messages say what went wrong
    "E501",  # line length: the formatter wraps code, and what's left is long strings
    "T201",  # print: each module's __main__ block prints what it did
]

# Groups the imports into the standard library, third-party packages, and this repo's modules, each sorted.
[tool.ruff.lint.isort]
known-first-party = ["mik_automator"]
combine-as-imports = true

[tool.pyright]
# Pyright doesn't read .gitignore, so a stale build/ left behind by `pip install .`
# gets type-checked as a second copy of the source. Setting exclude replaces
# Pyright's defaults, hence __pycache__ and dotted dirs are restated here.
exclude = ["build", "dist", "**/__pycache__", "**/.*"]
