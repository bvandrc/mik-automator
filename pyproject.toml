[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mik-automator"
version = "1.1.0"
description = "Windows automator and database tools for Mixed In Key 11"
requires-python = ">= 3.10"
readme = "README.md"
authors = [
    { name = "bvandrc", email = "bvandercar@outlook.com" },
]
keywords = ["mixed in key", "mixedinkey", "mik", "dj", "key detection", "harmonic mixing", "automation"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
# Windows only: pywinauto drives the app through UI Automation, and pywin32 sends it window messages
dependencies = ["pywinauto", "pywin32", "comtypes"]

[project.optional-dependencies]
dev = ["black", "pylint", "pyright", "build", "twine"]

[project.urls]
Repository = "https://github.com/bvandrc/mik-automator"
Issues = "https://github.com/bvandrc/mik-automator/issues"
Changelog = "https://github.com/bvandrc/mik-automator/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mik_automator*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pyright]
# Pyright doesn't read .gitignore, so a stale build/ left behind by `pip install .`
# gets type-checked as a second copy of the source. Setting exclude replaces
# Pyright's defaults, hence __pycache__ and dotted dirs are restated here.
exclude = ["build", "dist", "**/__pycache__", "**/.*"]
